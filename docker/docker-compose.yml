services:

  web:
    build:
      context: ../
      dockerfile: docker/http_server.dockerfile
    # Apache listens on 8080 inside, so nothing here needs privilege.
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      - MULTI_INTERNAL_HOST=multi
      - MULTI_INTERNAL_PORT=9160
      - PR2HUB_PROXY_URL=http://pr2hub-proxy:8080
      # The gate. Before every request and every cron run, the work reads the
      # observer on its own host and the super observer, and stops if either is
      # not alive or anything anywhere has halted. Continuous, not a boot
      # check: a heartbeat that is missing or stale counts as halted, and the
      # question is asked again by the next request.
      #
      # Required rather than defaulted, on the same grounds as the observer's
      # own values below: these decide how long the work may run unobserved,
      # and a number in code is a number no review of a deployment ever sees.
      #
      # The local window is tight because the observer and the work share a
      # clock. The super window is loose because they do not, and it can afford
      # to be: the local observer already judges the super observer every cycle
      # by a method that needs no clock at all.
      - OBSERVER_STORES=/stores
      - OBSERVER_LOCAL=web
      - OBSERVER_LOCAL_MAX_AGE_SECONDS=8
      - OBSERVER_SUPER_MAX_AGE_SECONDS=20
      # The observer. Everything SPEC.md lists under "Values to be set" is
      # required here rather than defaulted in code, so that a deployment
      # states them where they can be reviewed.
      #
      # The cadence is a ceiling, not a pace. Cycles are not slept between;
      # the next begins when the previous ends. This is the longest a cycle
      # may take and still count as verifying the system.
      - OBSERVER_IDENTITY=web
      # How long after an observer starts the work in its container may take
      # before its absence is a fault. It must exceed a cold start -- the ring
      # reaching a clear state and the work reaching its listening socket --
      # or it expires while the barrier is still legitimately waiting, and the
      # two deadlock: the barrier waits for a clear ring, the ring is not clear
      # because the work is not running, the work is not running because the
      # barrier is waiting. It is also the ceiling on how long work that is
      # never coming goes unreported, so it is no larger than it has to be.
      - OBSERVER_WORK_START_GRACE_SECONDS=120
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      # Shipped content, served read-only. The only thing mounted inside the
      # tree the image ships, and nothing writes to it.
      - ../clients:/pr2/http_server/clients:ro
      # Everything the application writes. The served tree reaches these
      # through symlinks made when the image is built, so their URLs are
      # unchanged and the tree itself never varies.
      - app-data:/pr2/data
      - ../../levels:/pr2/data/levels
      - ../../replays:/pr2/data/replays
      - shared-data:/pr2/shared
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web
      - super-halts:/stores/super/halts
      #   web
      - store-web:/stores/web
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts:ro
    depends_on:
      - mysql
      - pr2hub-proxy
    # What happens when it stops, stated rather than left to the engine's
    # default. This container holds the web observer as well as the work, so a
    # stop takes a ring member with it: the other three raise a halt for the
    # member that vanished, and what would lift it is the container that died.
    restart: always

  # The scheduler, from the same image as web. It is a service of its own
  # because cron must start as root in order to drop to the unprivileged user
  # the jobs themselves run as -- and keeping it separate means the container
  # that serves has no root process in it at all. Nothing here listens.
  cron:
    build:
      context: ../
      dockerfile: docker/http_server.dockerfile
    user: "0:0"
    command: ["/cron_startup.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The only thing root is kept for: dropping to www-data per job.
      - SETUID
      - SETGID
    environment:
      - MULTI_INTERNAL_HOST=multi
      - MULTI_INTERNAL_PORT=9160
      - PR2HUB_PROXY_URL=http://pr2hub-proxy:8080
      # The gate. Every job is its own process and every process passes through
      # config.php, so this is the whole of the coupling here: a job whose
      # observer is not alive, or that finds a halt anywhere, does not start.
      #
      # OBSERVER_LOCAL is `web` and this container holds no observer of its
      # own. That is a real gap and it is named rather than papered over: the
      # scheduler was split out of the web container in 0c because cron must
      # start as root, and what watches it is the web observer reading the
      # traces its jobs write, from the next container along. The heartbeat
      # this gate reads therefore attests that the web container is intact, not
      # that this one is. Closing it means a fifth member of the ring.
      - OBSERVER_STORES=/stores
      - OBSERVER_LOCAL=web
      - OBSERVER_LOCAL_MAX_AGE_SECONDS=8
      - OBSERVER_SUPER_MAX_AGE_SECONDS=20
    volumes:
      - app-data:/pr2/data
      - ../../levels:/pr2/data/levels
      - ../../replays:/pr2/data/replays
      - shared-data:/pr2/shared
      # The store tree, read-only in every path. This container runs work and
      # holds no observer, so it is the one place that reads the whole tree and
      # writes to none of it.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts:ro
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts:ro
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts:ro
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts:ro
    depends_on:
      - mysql
    # As web. A scheduler that is not running writes no traces, and traces that
    # stop arriving are a fault in the observer next door -- so a stop here
    # halts the ring by a route nothing would undo.
    restart: always

  pr2hub-proxy:
    build:
      context: ../
      dockerfile: docker/pr2hub_proxy.dockerfile
    user: proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PROXY_UPSTREAM_BASE=https://pr2hub.com
      # The gate. This container serves a route on the game's own origin --
      # Apache maps /pr2hub/ here with ProxyPass, so mod_proxy answers it and
      # PHP never runs, which is why the gate in config.php never covered it.
      # It reads the store itself instead. See pr2hub_proxy/gate.go.
      #
      # There is no OBSERVER_LOCAL because this container holds no observer and
      # is no member of the ring: what it reads is the super observer's
      # heartbeat and every member's stop signals, none of which it can write.
      # Nothing here watches this container in turn, which is the same gap the
      # scheduler has and is named in the same way.
      - OBSERVER_STORES=/stores
      - OBSERVER_SUPER_MAX_AGE_SECONDS=20
    volumes:
      - pr2hub-proxy-cache:/cache
      # The store tree, read-only in every path -- the whole tree and not only
      # the paths the gate reads, so that what this container may write is a
      # question the kernel answers everywhere rather than in the places
      # somebody remembered to mount. verify-stores.sh probes all seventeen and
      # expects `ro` from this service at every one of them.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts:ro
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts:ro
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts:ro
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts:ro
    # Nothing observes this container. Gating it made it a participant, not a
    # member, so a stop here is a silent loss of the /pr2hub/ route that no
    # member would report. This policy is the only thing that notices.
    restart: always

  multi:
    build:
      context: ../
      dockerfile: docker/multi_server.dockerfile
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "9160:9160"
    # depends_on:
    #   - liquibase
    restart: always
    environment:
      # The observer. Everything SPEC.md lists under "Values to be set" is
      # required here rather than defaulted in code, so a deployment states
      # them where they can be reviewed.
      #
      # The cadence is a ceiling, not a pace. Cycles are not slept between;
      # the next begins when the previous ends. This is the longest a cycle
      # may take and still count as verifying the system.
      # The gate. Before it starts, and on its own timer for as long as it
      # runs, the game server reads the observer in this container and the
      # super observer, and stops working if either is not alive or anything
      # anywhere has halted. A missing or stale heartbeat counts as halted.
      - OBSERVER_STORES=/stores
      # Where the game server binds its player port. It used to come from the
      # server's own row in the database, so a table decided where this
      # container answered, while the publish below, the image and the
      # observer's column all declared it somewhere none of them could set.
      - PLAYER_PORT=9160
      - OBSERVER_LOCAL=multi
      - OBSERVER_LOCAL_MAX_AGE_SECONDS=8
      - OBSERVER_SUPER_MAX_AGE_SECONDS=20
      - OBSERVER_IDENTITY=multi
      # How long after an observer starts the work in its container may take
      # before its absence is a fault. It must exceed a cold start -- the ring
      # reaching a clear state and the work reaching its listening socket --
      # or it expires while the barrier is still legitimately waiting, and the
      # two deadlock: the barrier waits for a clear ring, the ring is not clear
      # because the work is not running, the work is not running because the
      # barrier is waiting. It is also the ceiling on how long work that is
      # never coming goes unreported, so it is no larger than it has to be.
      - OBSERVER_WORK_START_GRACE_SECONDS=120
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      - shared-data:/pr2/shared
      # This image never copies http_server in, so it has no served tree at
      # all. It reads levels and writes replays, and both are data.
      - app-data:/pr2/data
      - ../../levels:/pr2/data/levels:ro
      - ../../replays:/pr2/data/replays
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts:ro
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts

  policy:
    build:
      context: ../
      dockerfile: docker/policy_server.dockerfile
    # The policy server exits if the gate refuses at boot, and the barrier in
    # the startup script then waits here with the observer running rather than
    # leaving the ring a member short. Without a restart policy a halt that
    # lifted would leave this container down for good.
    restart: always
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The Flash client dials 843. The process inside listens on 8843, which
    # it can bind without privilege.
    ports:
      - "843:8843"

    environment:
      # The observer. Everything SPEC.md lists under "Values to be set" is
      # required here rather than defaulted in code, so a deployment states
      # them where they can be reviewed.
      #
      # The cadence is a ceiling, not a pace. Cycles are not slept between;
      # the next begins when the previous ends. This is the longest a cycle
      # may take and still count as verifying the system.
      # The gate. Before it starts, and on its own timer for as long as it
      # runs, the policy server reads the observer in this container and the
      # super observer, and stops answering if either is not alive or anything
      # anywhere has halted. A missing or stale heartbeat counts as halted.
      - OBSERVER_STORES=/stores
      - OBSERVER_LOCAL=policy
      - OBSERVER_LOCAL_MAX_AGE_SECONDS=8
      - OBSERVER_SUPER_MAX_AGE_SECONDS=20
      - OBSERVER_IDENTITY=policy
      # How long after an observer starts the work in its container may take
      # before its absence is a fault. It must exceed a cold start -- the ring
      # reaching a clear state and the work reaching its listening socket --
      # or it expires while the barrier is still legitimately waiting, and the
      # two deadlock: the barrier waits for a clear ring, the ring is not clear
      # because the work is not running, the work is not running because the
      # barrier is waiting. It is also the ceiling on how long work that is
      # never coming goes unreported, so it is no larger than it has to be.
      - OBSERVER_WORK_START_GRACE_SECONDS=120
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts
      #   policy
      - store-policy:/stores/policy
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts:ro
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts
  # The fourth member: in the ring, not above it. It gives no instructions and
  # nothing asks it for permission. What it has that the others do not is a
  # complete view -- it compares every copy against the store it came from,
  # which is the check no member can perform for itself.
  super:
    build:
      context: ../
      dockerfile: docker/super_observer.dockerfile
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OBSERVER_IDENTITY=super
      # How long after an observer starts the work in its container may take
      # before its absence is a fault. It must exceed a cold start -- the ring
      # reaching a clear state and the work reaching its listening socket --
      # or it expires while the barrier is still legitimately waiting, and the
      # two deadlock: the barrier waits for a clear ring, the ring is not clear
      # because the work is not running, the work is not running because the
      # barrier is waiting. It is also the ceiling on how long work that is
      # never coming goes unreported, so it is no larger than it has to be.
      - OBSERVER_WORK_START_GRACE_SECONDS=120
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super
      - multi-halts:/stores/multi/halts
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super
      - policy-halts:/stores/policy/halts
      #   super
      - store-super:/stores/super
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts:ro
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super
      - web-halts:/stores/web/halts
    # The one whose absence every other member halts on, and none of them can
    # lift: what would lift it is this container. It declared no policy at
    # all, which made the ring's most consequential stop the least handled.
    restart: always

  mysql:
    image: mysql
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_DATABASE: pr2
      MYSQL_USER: pr2
      MYSQL_PASSWORD: pr2
      # Required from the environment, with no default.
      #
      # The application's own password is the one above, and a deployment that
      # leaves it alone is stopped by the boot check, because it is an
      # env.example value and that check refuses to start on those. The root
      # password had no such cover: it was the literal `root`, it is what the
      # migration runner authenticates with, and a deployment that changed the
      # first and not the second still had a known root credential on the
      # network the database console used to bridge to the outside.
      #
      # `:?` means compose refuses to start at all when the value is absent, so
      # supplying it is part of setting the deployment up rather than something
      # to remember.
      #
      # **It does not change the password of a database that already exists.**
      # The image applies this only while initialising an empty data directory;
      # on an existing volume it is read, ignored, and whatever root was set to
      # at first start remains. Setting it on a running deployment therefore
      # does nothing at all, and looks like it did something, which is worse
      # than the literal it replaced would have been if left alone.
      #
      # What catches the mismatch is the migration runner below, which
      # authenticates as root with this same value: if the two disagree, the
      # migrations fail to connect and say so. That is the only automatic
      # detection there is, and it only runs when migrations run.
      #
      # Changing root on a database that already exists is an ALTER USER
      # against that database, done deliberately, and then this value is what
      # it was changed to.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set a root password for the database}
    volumes:
      - mysql-data:/var/lib/mysql
    # Everything that holds player data. No observer reads this service
    # (T26), so its coming back is not something the ring would arrange.
    restart: always

  liquibase:
    build:
      context: ../
      dockerfile: docker/liquibase.dockerfile
    command: update
    user: liquibase
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LIQUIBASE_URL: jdbc:mysql://mysql/pr2
      LIQUIBASE_USERNAME: root
      # The same credential as the database, required the same way, so the two
      # cannot drift and neither can be left at a value the repository states.
      LIQUIBASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set a root password for the database}
      LIQUIBASE_CHANGELOG: /liquibase/changelog.yaml
    volumes:
      - ../liquibase:/liquibase
      - ./:/scripts
    depends_on:
      - mysql
    restart: 'no'


volumes:
  store-multi:
  multi-copy:
  multi-copy-super:
  multi-halts:
  store-policy:
  policy-copy:
  policy-copy-super:
  policy-halts:
  store-super:
  super-copy-multi:
  super-copy-policy:
  super-copy-web:
  super-halts:
  store-web:
  web-copy:
  web-copy-super:
  web-halts:
  mysql-data:
  shared-data:
  app-data:
  pr2hub-proxy-cache:
