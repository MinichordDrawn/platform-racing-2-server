services:

  web:
    build:
      context: ../
      dockerfile: docker/http_server.dockerfile
    # Apache listens on 8080 inside, so nothing here needs privilege.
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      - MULTI_INTERNAL_HOST=multi
      - MULTI_INTERNAL_PORT=9160
      - PR2HUB_PROXY_URL=http://pr2hub-proxy:8080
      # The observer. Everything SPEC.md lists under "Values to be set" is
      # required here rather than defaulted in code, so that a deployment
      # states them where they can be reviewed.
      #
      # The cadence is a ceiling, not a pace. Cycles are not slept between;
      # the next begins when the previous ends. This is the longest a cycle
      # may take and still count as verifying the system.
      - OBSERVER_IDENTITY=web
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      # Shipped content, served read-only. The only thing mounted inside the
      # tree the image ships, and nothing writes to it.
      - ../clients:/pr2/http_server/clients:ro
      # Everything the application writes. The served tree reaches these
      # through symlinks made when the image is built, so their URLs are
      # unchanged and the tree itself never varies.
      - app-data:/pr2/data
      - ../../levels:/pr2/data/levels
      - ../../replays:/pr2/data/replays
      - shared-data:/pr2/shared
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web
      - super-halts:/stores/super/halts
      #   web
      - store-web:/stores/web
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts:ro
    depends_on:
      - mysql
      - pr2hub-proxy

  # The scheduler, from the same image as web. It is a service of its own
  # because cron must start as root in order to drop to the unprivileged user
  # the jobs themselves run as -- and keeping it separate means the container
  # that serves has no root process in it at all. Nothing here listens.
  cron:
    build:
      context: ../
      dockerfile: docker/http_server.dockerfile
    user: "0:0"
    command: ["/cron_startup.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The only thing root is kept for: dropping to www-data per job.
      - SETUID
      - SETGID
    environment:
      - MULTI_INTERNAL_HOST=multi
      - MULTI_INTERNAL_PORT=9160
      - PR2HUB_PROXY_URL=http://pr2hub-proxy:8080
    volumes:
      - app-data:/pr2/data
      - ../../levels:/pr2/data/levels
      - ../../replays:/pr2/data/replays
      - shared-data:/pr2/shared
    depends_on:
      - mysql

  pr2hub-proxy:
    build:
      context: ../
      dockerfile: docker/pr2hub_proxy.dockerfile
    user: proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PROXY_UPSTREAM_BASE=https://pr2hub.com
    volumes:
      - pr2hub-proxy-cache:/cache

  multi:
    build:
      context: ../
      dockerfile: docker/multi_server.dockerfile
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "9160:9160"
    # depends_on:
    #   - liquibase
    restart: always
    environment:
      # The observer. Everything SPEC.md lists under "Values to be set" is
      # required here rather than defaulted in code, so a deployment states
      # them where they can be reviewed.
      #
      # The cadence is a ceiling, not a pace. Cycles are not slept between;
      # the next begins when the previous ends. This is the longest a cycle
      # may take and still count as verifying the system.
      - OBSERVER_IDENTITY=multi
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      - shared-data:/pr2/shared
      # This image never copies http_server in, so it has no served tree at
      # all. It reads levels and writes replays, and both are data.
      - app-data:/pr2/data
      - ../../levels:/pr2/data/levels:ro
      - ../../replays:/pr2/data/replays
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts:ro
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts

  policy:
    build:
      context: ../
      dockerfile: docker/policy_server.dockerfile
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The Flash client dials 843. The process inside listens on 8843, which
    # it can bind without privilege.
    ports:
      - "843:8843"

    environment:
      # The observer. Everything SPEC.md lists under "Values to be set" is
      # required here rather than defaulted in code, so a deployment states
      # them where they can be reviewed.
      #
      # The cadence is a ceiling, not a pace. Cycles are not slept between;
      # the next begins when the previous ends. This is the longest a cycle
      # may take and still count as verifying the system.
      - OBSERVER_IDENTITY=policy
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super:ro
      - multi-halts:/stores/multi/halts
      #   policy
      - store-policy:/stores/policy
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super:ro
      - policy-halts:/stores/policy/halts:ro
      #   super
      - store-super:/stores/super:ro
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy
      - web-copy-super:/stores/web/copy-super:ro
      - web-halts:/stores/web/halts
  # The fourth member: in the ring, not above it. It gives no instructions and
  # nothing asks it for permission. What it has that the others do not is a
  # complete view -- it compares every copy against the store it came from,
  # which is the check no member can perform for itself.
  super:
    build:
      context: ../
      dockerfile: docker/super_observer.dockerfile
    user: www-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OBSERVER_IDENTITY=super
      - OBSERVER_CADENCE_SECONDS=6
      - OBSERVER_MIN_CYCLE_MS=300
      - OBSERVER_HEARTBEAT_MAX_AGE_SECONDS=8
      - OBSERVER_STALE_SLACK_CYCLES=1
      - OBSERVER_STAGING_STALE_AFTER_SECONDS=60
      - OBSERVER_MAX_HEARTBEAT_BYTES=8192
      - OBSERVER_MAX_FAULT_BYTES=8192
      - OBSERVER_MAX_HALT_BYTES=8192
    volumes:
      # The store tree (SPEC 2). Every path has one writer and the
      # read-only flags are what make that true rather than agreed.
      #   multi
      - store-multi:/stores/multi:ro
      - multi-copy:/stores/multi/copy:ro
      - multi-copy-super:/stores/multi/copy-super
      - multi-halts:/stores/multi/halts
      #   policy
      - store-policy:/stores/policy:ro
      - policy-copy:/stores/policy/copy:ro
      - policy-copy-super:/stores/policy/copy-super
      - policy-halts:/stores/policy/halts
      #   super
      - store-super:/stores/super
      - super-copy-multi:/stores/super/copy-multi:ro
      - super-copy-policy:/stores/super/copy-policy:ro
      - super-copy-web:/stores/super/copy-web:ro
      - super-halts:/stores/super/halts:ro
      #   web
      - store-web:/stores/web:ro
      - web-copy:/stores/web/copy:ro
      - web-copy-super:/stores/web/copy-super
      - web-halts:/stores/web/halts

  mysql:
    image: mysql
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_DATABASE: pr2
      MYSQL_USER: pr2
      MYSQL_PASSWORD: pr2
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  liquibase:
    build:
      context: ../
      dockerfile: docker/liquibase.dockerfile
    command: update
    user: liquibase
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LIQUIBASE_URL: jdbc:mysql://mysql/pr2
      LIQUIBASE_USERNAME: root
      LIQUIBASE_PASSWORD: root
      LIQUIBASE_CHANGELOG: /liquibase/changelog.yaml
    volumes:
      - ../liquibase:/liquibase
      - ./:/scripts
    depends_on:
      - mysql
    restart: 'no'

  adminer:
    image: adminer
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - 8081:8080
    depends_on:
      - mysql

volumes:
  store-multi:
  multi-copy:
  multi-copy-super:
  multi-halts:
  store-policy:
  policy-copy:
  policy-copy-super:
  policy-halts:
  store-super:
  super-copy-multi:
  super-copy-policy:
  super-copy-web:
  super-halts:
  store-web:
  web-copy:
  web-copy-super:
  web-halts:
  mysql-data:
  shared-data:
  app-data:
  pr2hub-proxy-cache:
