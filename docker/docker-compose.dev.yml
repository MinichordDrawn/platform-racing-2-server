# Development conveniences, kept out of the file a deployment is built from.
#
# What is here is here because it is useful while working on the server and
# because it must not be published by anything that serves players. The
# deployment publishes four ports and every one of them belongs to a container
# that holds an observer and reads the gate before it works. A database console
# is neither: it runs a third-party image with none of this package's code in
# it, so there is nowhere to put a check, and a halt would stop every way into
# the data except that one.
#
# The database itself publishes nothing and is reachable only on the compose
# network. Publishing a console bridges that network straight to the outside,
# which is the whole of what it is for and exactly why it does not ship.
#
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:

  # A database console on 8081. Reaches every customer row, every credential
  # column and every power column, and is observed and gated by nothing.
  #
  # Bring it up deliberately, on a machine that is not serving anybody, and
  # take it down again. It reads the root credential from the environment for
  # the same reason everything else here does: a password that lives in a file
  # in the repository is a password anyone who can read the repository holds.
  adminer:
    image: adminer
    restart: 'no'
    user: adminer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - 8081:8080
    depends_on:
      - mysql
